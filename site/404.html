<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArknightsNexus</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050914">
  <script>
    // GitHub Pages serves this page for any missing path. The web app routes
    // with hash URLs (/ArknightsNexus/#/operators/char_002_amiya), so a
    // path-style link to an app page (/ArknightsNexus/operators/...) is
    // forwarded to the same page in hash form. Paths that look like files
    // (data/, *.html, *.json, ...) stay a real "not found".
    (function () {
      var parts = location.pathname.split('/');
      var base = '/' + (parts[1] || '') + (parts[1] ? '/' : '');
      var rest = parts.slice(2).join('/');
      var looksLikeFile = /\.[A-Za-z0-9]+$/.test(rest) || /^data(\/|$)/.test(rest);
      if (rest && !looksLikeFile) {
        location.replace(base + '#/' + rest + location.search);
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #050914; color: #c9d6ee; font: 16px/1.7 system-ui, sans-serif; text-align: center; }
    a { color: #8bd6ff; }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>Page not found. <a id="home" href="/">ArknightsNexus</a></p>
  </main>
  <script>
    var first = location.pathname.split('/')[1];
    if (first) document.getElementById('home').href = '/' + first + '/';
  </script>
</body>
</html>
