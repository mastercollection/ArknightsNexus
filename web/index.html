  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ArknightsNexus: 명일방주 오퍼레이터·아이템 정보와 육성 계획을 돕는 비공식 팬 메이드 앱 (웹 버전)">

  <style>
    html, body { margin: 0; height: 100%; background: #050914; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      color: #8ea3c7; font: 14px system-ui, sans-serif;
    }
    #loading img { width: 88px; height: 88px; animation: pulse 1.6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) { #loading img { animation: none; } }
  </style>

<body>
